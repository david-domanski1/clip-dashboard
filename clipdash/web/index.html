<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Dashboard</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <a class="brand" href="#/"><img class="logo" src="/static/logo.svg" alt=""><div><b>clipdash</b><small id="brand-sub">loading…</small></div></a>
    <div class="campaign-pick">
      <label>Campaign</label>
      <select id="campaign-select"></select>
    </div>
    <nav id="nav">
      <a href="#/" data-view="home"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg></i>Today <b class="pill hot" id="pill-attention" title="needs attention"></b></a>
      <a href="#/review" data-view="review"><i><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="m9.5 12 2 2 3.5-4"/></svg></i>Review <b class="pill" id="pill-review"></b></a>
      <a href="#/publish" data-view="publish"><i><svg viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="M21 3 14 21l-4-7-7-4z"/></svg></i>Publish <b class="pill" id="pill-publish"></b></a>
      <a href="#/submissions" data-view="submissions"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i>Submissions <b class="pill hot" id="pill-subs"></b></a>
      <a href="#/sources" data-view="sources"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg></i>Sources <b class="pill" id="pill-videos" title="videos being scanned or rendered"></b></a>
      <a href="#/settings" data-view="settings"><i><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg></i>Settings</a>
    </nav>
    <div id="side-status">
      <div id="jobs-mini"></div>
      <div id="disk-mini"></div>
      <div id="dry-run-flag" class="hidden">DRY RUN · nothing is posted</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
